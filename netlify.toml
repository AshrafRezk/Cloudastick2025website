[build]
  # Build command for Vite React app
  command = "npm run build"
  
  # Directory to publish (Vite's default output directory)
  publish = "dist"
  
  # Functions directory
  functions = "netlify/functions"

[build.environment]
  # Node.js version
  NODE_VERSION = "18"

# Redirect rules for SPA (Single Page Application)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Headers for better performance and security
[[headers]]
  for = "/*"
  [headers.values]
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Cache static assets (with revalidation to allow updates)
[[headers]]
  for = "/Assets/Company Members/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

# Cache other assets
[[headers]]
  for = "/Assets/*"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Form handling (if needed for contact forms)
[build.processing]
  skip_processing = false

[build.processing.css]
  bundle = true
  minify = true

[build.processing.js]
  bundle = true
  minify = true

[build.processing.html]
  pretty_urls = true

# Scheduled Functions - Bulk Salesforce Sync
# Runs every 6 hours to sync all Salesforce data to cache
# Note: For scheduled functions to work, you need:
# 1. Use Netlify's built-in scheduled functions (name file with schedule pattern)
# 2. Set environment variables: SALESFORCE_ACCESS_TOKEN and SALESFORCE_INSTANCE_URL
# 3. Or use an external cron service (easier for now)
# 
# To enable scheduled functions, rename the function file to include the schedule:
# Example: scheduledBulkSync-cron.js (runs every hour)
# Or configure in netlify.toml with [functions."scheduledBulkSync"] schedule = "0 */6 * * *"
